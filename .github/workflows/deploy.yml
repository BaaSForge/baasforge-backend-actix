name: Deploy

on:
  push:
    tags:
      - "v*-prod.*"
      - "v*-stage.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to deploy (e.g. v0.0.1-prod.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.event.inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      app_env: ${{ steps.meta.outputs.app_env }}
      environment: ${{ steps.meta.outputs.environment }}
      deploy_suffix: ${{ steps.meta.outputs.deploy_suffix }}
      image_base: ${{ steps.meta.outputs.image_base }}
    steps:
      - name: Resolve environment
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-prod\.[0-9]+$ ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "app_env=PROD" >> "$GITHUB_OUTPUT"
            echo "deploy_suffix=prod" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-stage\.[0-9]+$ ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "app_env=STAGE" >> "$GITHUB_OUTPUT"
            echo "deploy_suffix=stage" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not match a deploy pattern."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  # TEMP: disabled while debugging migrate — re-enable before real deploys
  build-and-push:
    if: false
    needs: resolve-meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            dockerfile: Dockerfile
            image_suffix: ""
            container_suffix: ""
            expose_ports: true
          - service: chat-worker
            dockerfile: docker/Dockerfile.chat_worker
            image_suffix: "-chat-worker"
            container_suffix: "-chat-worker"
            expose_ports: false
          - service: unit-technical-reviewer
            dockerfile: docker/Dockerfile.unit_technical_reviewer
            image_suffix: "-unit-technical-reviewer"
            container_suffix: "-unit-technical-reviewer"
            expose_ports: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-meta.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ needs.resolve-meta.outputs.image_base }}${{ matrix.image_suffix }}:${{ needs.resolve-meta.outputs.tag }}
          build-args: |
            APP_ENV=${{ needs.resolve-meta.outputs.app_env }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ needs.resolve-meta.outputs.app_env }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ needs.resolve-meta.outputs.app_env }}

  migrate:
    needs: [resolve-meta]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-meta.outputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_ACCESS_TOKEN_SECRET: ${{ secrets.AUTH_ACCESS_TOKEN_SECRET }}
      AUTH_REFRESH_TOKEN_SECRET: ${{ secrets.AUTH_REFRESH_TOKEN_SECRET }}
      RABBIT_URL: ${{ secrets.RABBIT_URL }}
      RABBITMQ_MANAGEMENT_URL: ${{ vars.RABBITMQ_MANAGEMENT_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      RUNTIME_NATS_URL: ${{ secrets.RUNTIME_NATS_URL }}
      BASE_RUNTIME_ENDPOINT: ${{ vars.BASE_RUNTIME_ENDPOINT }}
      JAEGER_QUERY_BASE_URL: ${{ secrets.JAEGER_QUERY_BASE_URL }}
    steps:
      - name: Run database migrations
        uses: appleboy/ssh-action@v1.2.2
        env:
          # TEMP: hardcoded while build-and-push is disabled — revert before real deploys
          IMAGE: ${{ needs.resolve-meta.outputs.image_base }}:v0.0.1-prod.4
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: >-
            IMAGE,GHCR_USER,GHCR_TOKEN,
            DATABASE_URL,AUTH_ACCESS_TOKEN_SECRET,AUTH_REFRESH_TOKEN_SECRET,
            RABBIT_URL,RABBITMQ_MANAGEMENT_URL,GEMINI_API_KEY,REDIS_URL,
            RUNTIME_NATS_URL,BASE_RUNTIME_ENDPOINT,JAEGER_QUERY_BASE_URL
          script: |
            set -euo pipefail

            if command -v systemctl >/dev/null 2>&1; then
              systemctl enable docker
              systemctl start docker
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker run --rm --network host \
              -e DATABASE_URL \
              -e AUTH_ACCESS_TOKEN_SECRET \
              -e AUTH_REFRESH_TOKEN_SECRET \
              -e RABBIT_URL \
              -e RABBITMQ_MANAGEMENT_URL \
              -e GEMINI_API_KEY \
              -e REDIS_URL \
              -e RUNTIME_NATS_URL \
              -e BASE_RUNTIME_ENDPOINT \
              -e JAEGER_QUERY_BASE_URL \
              "$IMAGE" \
              sh -c '
                SAVED_DATABASE_URL="$DATABASE_URL"
                SAVED_AUTH_ACCESS_TOKEN_SECRET="$AUTH_ACCESS_TOKEN_SECRET"
                SAVED_AUTH_REFRESH_TOKEN_SECRET="$AUTH_REFRESH_TOKEN_SECRET"
                SAVED_RABBIT_URL="$RABBIT_URL"
                SAVED_RABBITMQ_MANAGEMENT_URL="$RABBITMQ_MANAGEMENT_URL"
                SAVED_GEMINI_API_KEY="$GEMINI_API_KEY"
                SAVED_REDIS_URL="$REDIS_URL"
                SAVED_RUNTIME_NATS_URL="$RUNTIME_NATS_URL"
                SAVED_BASE_RUNTIME_ENDPOINT="$BASE_RUNTIME_ENDPOINT"
                SAVED_JAEGER_QUERY_BASE_URL="$JAEGER_QUERY_BASE_URL"
                set -a && . ./.env && set +a
                export DATABASE_URL="$SAVED_DATABASE_URL"
                export AUTH_ACCESS_TOKEN_SECRET="$SAVED_AUTH_ACCESS_TOKEN_SECRET"
                export AUTH_REFRESH_TOKEN_SECRET="$SAVED_AUTH_REFRESH_TOKEN_SECRET"
                export RABBIT_URL="$SAVED_RABBIT_URL"
                export RABBITMQ_MANAGEMENT_URL="$SAVED_RABBITMQ_MANAGEMENT_URL"
                export GEMINI_API_KEY="$SAVED_GEMINI_API_KEY"
                export REDIS_URL="$SAVED_REDIS_URL"
                export RUNTIME_NATS_URL="$SAVED_RUNTIME_NATS_URL"
                export BASE_RUNTIME_ENDPOINT="$SAVED_BASE_RUNTIME_ENDPOINT"
                export JAEGER_QUERY_BASE_URL="$SAVED_JAEGER_QUERY_BASE_URL"
                diesel migration run
              '
            docker image prune -f
            echo "Migrations complete"

  deploy:
    needs: [resolve-meta, build-and-push, migrate]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-meta.outputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_ACCESS_TOKEN_SECRET: ${{ secrets.AUTH_ACCESS_TOKEN_SECRET }}
      AUTH_REFRESH_TOKEN_SECRET: ${{ secrets.AUTH_REFRESH_TOKEN_SECRET }}
      RABBIT_URL: ${{ secrets.RABBIT_URL }}
      RABBITMQ_MANAGEMENT_URL: ${{ vars.RABBITMQ_MANAGEMENT_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      RUNTIME_NATS_URL: ${{ secrets.RUNTIME_NATS_URL }}
      BASE_RUNTIME_ENDPOINT: ${{ vars.BASE_RUNTIME_ENDPOINT }}
      JAEGER_QUERY_BASE_URL: ${{ secrets.JAEGER_QUERY_BASE_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            image_suffix: ""
            container_suffix: ""
            expose_ports: true
          - service: chat-worker
            image_suffix: "-chat-worker"
            container_suffix: "-chat-worker"
            expose_ports: false
          - service: unit-technical-reviewer
            image_suffix: "-unit-technical-reviewer"
            container_suffix: "-unit-technical-reviewer"
            expose_ports: false
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ needs.resolve-meta.outputs.image_base }}${{ matrix.image_suffix }}:${{ needs.resolve-meta.outputs.tag }}
          CONTAINER_NAME: baal-backend${{ matrix.container_suffix }}-${{ needs.resolve-meta.outputs.deploy_suffix }}
          EXPOSE_PORTS: ${{ matrix.expose_ports }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: >-
            IMAGE,CONTAINER_NAME,EXPOSE_PORTS,GHCR_USER,GHCR_TOKEN,
            DATABASE_URL,AUTH_ACCESS_TOKEN_SECRET,AUTH_REFRESH_TOKEN_SECRET,
            RABBIT_URL,RABBITMQ_MANAGEMENT_URL,GEMINI_API_KEY,REDIS_URL,
            RUNTIME_NATS_URL,BASE_RUNTIME_ENDPOINT,JAEGER_QUERY_BASE_URL
          script: |
            set -euo pipefail

            if command -v systemctl >/dev/null 2>&1; then
              systemctl enable docker
              systemctl start docker
            fi

            if docker info 2>/dev/null | grep -qi rootless; then
              if ! loginctl show-user "$(id -un)" -p Linger 2>/dev/null | grep -q "Linger=yes"; then
                echo "Rootless Docker needs linger enabled or containers stop when SSH ends."
                echo "Run: sudo loginctl enable-linger $(id -un)"
                exit 1
              fi
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            RUN_ARGS=(
              -d
              --name "$CONTAINER_NAME"
              --restart unless-stopped
              -e "DATABASE_URL=$DATABASE_URL"
              -e "AUTH_ACCESS_TOKEN_SECRET=$AUTH_ACCESS_TOKEN_SECRET"
              -e "AUTH_REFRESH_TOKEN_SECRET=$AUTH_REFRESH_TOKEN_SECRET"
              -e "RABBIT_URL=$RABBIT_URL"
              -e "RABBITMQ_MANAGEMENT_URL=$RABBITMQ_MANAGEMENT_URL"
              -e "GEMINI_API_KEY=$GEMINI_API_KEY"
              -e "REDIS_URL=$REDIS_URL"
              -e "RUNTIME_NATS_URL=$RUNTIME_NATS_URL"
              -e "BASE_RUNTIME_ENDPOINT=$BASE_RUNTIME_ENDPOINT"
              -e "JAEGER_QUERY_BASE_URL=$JAEGER_QUERY_BASE_URL"
            )

            if [ "$EXPOSE_PORTS" = "true" ]; then
              RUN_ARGS+=(
                -p 80:80
                -p 443:443
                -v /etc/letsencrypt/live/api.baasforge.com:/etc/letsencrypt/live/api.baasforge.com:ro
                -v /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
              )
            fi

            docker run "${RUN_ARGS[@]}" "$IMAGE"
            docker update --restart unless-stopped "$CONTAINER_NAME"

            RESTART_POLICY=$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$CONTAINER_NAME")
            if [ "$RESTART_POLICY" != "unless-stopped" ]; then
              echo "Restart policy not applied (got: $RESTART_POLICY)"
              exit 1
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
              echo "Container failed to start"
              docker logs "$CONTAINER_NAME" 2>&1 | tail -50
              exit 1
            fi

            docker image prune -f
            echo "Running $CONTAINER_NAME with restart policy: $RESTART_POLICY"
