[package]
name = "baal-backend-actix"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework & Core
actix = "0.13.5"
actix-web = "4.12.1"
actix-cors = "0.7.1"
actix-form-data = "0.6.2"
tracing-actix-web = "0.7.21"
actix-ws = "0.3.1"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-limitation = "0.5.1"

schemars = { package = "apistos-schemars", version = "0.8.22" }
apistos = "0.6.0"

# Async Runtime
tokio = { version = "1.49.0", features = ["full"] } # Essential for async/await

# Data Transformation (Lodash equivalent)
itertools = "0.14.0" # Powerful iterator utilities, often used for data manipulation
# Alternatively:
fancy = "0.3.1" # (more complex transformations)

# JSON Handling
serde = { version = "1.0.228", features = ["derive"] } # Serialization/Deserialization (essential)
serde_json = "1.0.149" # JSON specific serialization/deserialization

# Input Validation (Zod equivalent)
validator = { version = "0.20.0", features = ["derive"] } #  Schema-based validation, similar to Zod. Good documentation and community support

# HTTP Requests (Axios equivalent)
reqwest = { version = "0.13.1", features = ["json", "blocking"] } # Asynchronous HTTP client
# Alternatively:
ureq = "3.1.4" # (simpler, but less feature-rich)

# ORM (PostgreSQL with migrations - TypeORM/Prisma equivalent)
diesel = { version = "2.3.5", features = ["postgres", "r2d2"] } # Robust ORM with SQL migration support
diesel_migrations = "2.3.1"  # For running migrations
#diesel_cli = { version = "2.3.5", features = ["postgres"] } # Command-line tool for Diesel migrations
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }

# RabbitMQ SDK
lapin = "3.7.2" # Popular RabbitMQ client.
# Consider `rmq` if you need more advanced features
amq-protocol = "9.0.1"
amq-protocol-types = "9.0.1"
amq-protocol-tcp = "9.0.1"
amq-protocol-uri = "9.0.1"
amqprs = "2.1.3"

# Redis SDK
redis = { version = "1.0.2", features = ["tokio-comp", "json"] } # Official Redis client

# Hot Reloading (Nodemon equivalent)
# cargo-watch = { version = "1.0", features = ["run"] } # Watches for file changes and re-runs your program

# Minio SDK
#minio = "0.3.0" # Official Minio Rust client.  Good documentation and active development
rust-s3 = "0.37.1"

# LLM SDK (ChatGPT equivalent)
# This is tricky.  There isn't a *single* official ChatGPT SDK in Rust.
# You'll likely need to build your own wrapper around the OpenAI API.  Here's a starting point:
openai = "1.1.1" # Official OpenAI Rust client (for general API access)
# You'll need to implement the message formatting, tool calling logic yourself.

# Authentication (Passport equivalent)
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] } # For JWT creation and verification
ring = "0.17.14" # Cryptography library used by jsonwebtoken
# For OAuth providers (Google, Facebook, Github), you'll need to integrate with their APIs directly.
# There isn't a single "authentication" crate that handles everything.

# Cookie Handling
cookie = "0.18.1" # For reading and writing cookies

# .env File Reading (dotenv equivalent)
dotenv = "0.15.0" # Reads environment variables from a .env file

# Password Hashing (bcryptjs equivalent)
bcrypt = "0.18.0" # Secure password hashing

# Logging
tracing = "0.1.44" # Structured logging framework (highly recommended)
tracing-subscriber = "0.3.22" # Configure tracing output (stdout, stderr)
# Alternatively:
log = "0.4.29" # (simpler logging, but less structured)

# Swagger/OpenAPI Generation
#swagger-ui = { version = "0.1.5", features = ["rocket"] } # Generates swagger ui from your code, you need to add comments in your code
# Alternatively:
schematic = "0.19.2" # (more complex, but potentially more powerful)

# Image Manipulation (Sharp equivalent)
image = "0.25.9" # Comprehensive image processing library

# Date/Time Manipulation
chrono = { version = "0.4.43", features = ["serde"] } # Date and time handling

# Stripe SDK
#stripe-rust = "0.12.3"
async-stripe = { version = "0.41.0", features = ["runtime-tokio-hyper"] }

# Brevo (Email) SDK
brevo = "1.0.0" # Official Brevo Rust client

# Error Handling
anyhow = "1.0.100"
thiserror = "2.0.18"
