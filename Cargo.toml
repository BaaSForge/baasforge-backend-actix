# NOTE: Don't add inline comments as the parser can be confused

[package]
name = "baal-backend-actix"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web Framework & Core
actix = "0.13.5"
actix-web = "4.12.1"
actix-cors = "0.7.1"
actix-form-data = "0.6.2"
tracing-actix-web = "0.7.21"
actix-ws = "0.3.1"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-limitation = "0.5.1"

schemars = { package = "apistos-schemars", version = "0.8.22" }
apistos = "0.6.0"

# Async Runtime
# Essential for async/await
tokio = { version = "1.49.0", features = ["full"] }

# Data Transformation (Lodash equivalent)
# Powerful iterator utilities, often used for data manipulation
itertools = "0.14.0"
# Alternatively:
# (more complex transformations)
fancy = "0.3.1"

# JSON Handling
# Serialization/Deserialization (essential)
serde = { version = "1.0.228", features = ["derive"] }
# JSON specific serialization/deserialization
serde_json = "1.0.149"

# Input Validation (Zod equivalent)
#  Schema-based validation, similar to Zod. Good documentation and community support
validator = { version = "0.20.0", features = ["derive"] }

# HTTP Requests (Axios equivalent)
# Asynchronous HTTP client
reqwest = { version = "0.13.1", features = ["json", "blocking"] }
# Alternatively:
# (simpler, but less feature-rich)
ureq = "3.1.4"

# ORM (PostgreSQL with migrations - TypeORM/Prisma equivalent)
diesel = { version = "2.3.5", features = ["postgres", "r2d2", "chrono", "serde_json"] }
# For running migrations
diesel_migrations = "2.3.1"
# Command-line tool for Diesel migrations
#diesel_cli = { version = "2.3.5", features = ["postgres"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }

# RabbitMQ SDK
# Popular RabbitMQ client.
lapin = "3.7.2"
# Consider `rmq` if you need more advanced features
amq-protocol = "9.0.1"
amq-protocol-types = "9.0.1"
amq-protocol-tcp = "9.0.1"
amq-protocol-uri = "9.0.1"
amqprs = "2.1.3"

# Redis SDK
# Official Redis client
redis = { version = "1.0.2", features = ["tokio-comp", "json"] }

# Hot Reloading (Nodemon equivalent)
# Watches for file changes and re-runs your program
# cargo-watch = { version = "1.0", features = ["run"] }

# Minio SDK
# Official Minio Rust client.  Good documentation and active development
#minio = "0.3.0"
rust-s3 = "0.37.1"

# LLM SDK (ChatGPT equivalent)
# This is tricky.  There isn't a *single* official ChatGPT SDK in Rust.
# You'll likely need to build your own wrapper around the OpenAI API.  Here's a starting point:
# Official OpenAI Rust client (for general API access)
openai = "1.1.1"
# You'll need to implement the message formatting, tool calling logic yourself.

# Authentication (Passport equivalent)
# For JWT creation and verification
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
# Cryptography library used by jsonwebtoken
ring = "0.17.14"
# For OAuth providers (Google, Facebook, Github), you'll need to integrate with their APIs directly.
# There isn't a single "authentication" crate that handles everything.

# Cookie Handling
# For reading and writing cookies
cookie = "0.18.1"

# .env File Reading (dotenv equivalent)
# Reads environment variables from a .env file
dotenv = "0.15.0"

# Password Hashing (bcryptjs equivalent)
# Secure password hashing
bcrypt = "0.18.0"

# Logging
# Structured logging framework (highly recommended)
tracing = "0.1.44"
# Configure tracing output (stdout, stderr)
tracing-subscriber = "0.3.22"
# Alternatively:
# (simpler logging, but less structured)
log = "0.4.29"

# Swagger/OpenAPI Generation
# Generates swagger ui from your code, you need to add comments in your code
#swagger-ui = { version = "0.1.5", features = ["rocket"] }
# Alternatively:
# (more complex, but potentially more powerful)
schematic = "0.19.2"

# Image Manipulation (Sharp equivalent)
# Comprehensive image processing library
image = "0.25.9"

# Date/Time Manipulation
chrono = { version = "0.4.43", features = ["serde"] }

# Stripe SDK
#stripe-rust = "0.12.3"
async-stripe = { version = "0.41.0", features = ["runtime-tokio-hyper"] }

# Brevo (Email) SDK
# Official Brevo Rust client
brevo = "1.0.0"

# Error Handling
anyhow = "1.0.100"
thiserror = "2.0.18"
regex = { version = "1.12.2", features = ["unicode-perl", "perf"] }

kube = { version = "3.0.1", features = ["runtime", "derive", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.27.0", features = ["latest"] }
base64 = "0.22.1"
rustls = { version = "0.23.36", features = ["ring"] }
tokio-stream = "0.1.18"