services:
  postgres:
    image: postgres:17.6-alpine3.21
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: baal_db
      POSTGRES_USER: baal
      POSTGRES_PASSWORD: a4Z3AAga678ss2113sagh
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5632:5432"
    volumes:
      - ./.dev/postgres_data:/var/lib/postgresql/data
  rabbit:
    image: rabbitmq:4.2.3-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=baal
      - RABBITMQ_DEFAULT_PASS=BcO703J2qgpx72D1g7CHYt1
      - RABBITMQ_NODENAME=rabbit@rabbit
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./.dev/rabbit_data:/var/lib/rabbitmq
  redis:
    image: redis:8.2.1-alpine3.22
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
    ports:
      - "6379:6379"
    volumes:
      - ./.dev/redis_data:/data
  loadbalancer:
    image: nginx:stable-alpine3.23-perl
    container_name: baal-lb
    ports:
      - "1100:1100"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"