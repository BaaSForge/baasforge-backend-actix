services:
  postgres:
    image: postgres:17.6-alpine3.21
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: baal_db
      POSTGRES_USER: baal
      POSTGRES_PASSWORD: a4Z3AAga678ss2113sagh
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5632:5432"
    volumes:
      - ./.dev/postgres_data:/var/lib/postgresql/data
  rabbit:
    image: rabbitmq:4.2.3-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=baal
      - RABBITMQ_DEFAULT_PASS=BcO703J2qgpx72D1g7CHYt1
      - RABBITMQ_NODENAME=rabbit@rabbit
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./.dev/rabbit_data:/var/lib/rabbitmq