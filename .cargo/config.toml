# Run `cargo build` / `cargo run` through Clippy so both compiler and lint rules run; fail on lint.
# Requires: rustup component add clippy
#
# cargo clippy --fix hits a bug (multiple input filenames) when the wrapper is active.
# Use the script instead: ./clippy-fix.sh
# Or: CARGO_BUILD_RUSTC_WRAPPER= cargo clippy --fix
[build]
rustc-wrapper = "clippy-driver"

[alias]
lint = "clippy"
